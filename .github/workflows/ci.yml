name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (formato, clippy, tests, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - name: Build de release
        run: cargo build --release
      - name: Subir el ejecutable
        uses: actions/upload-artifact@v7
        with:
          name: obs-doctor-windows-x64
          path: target/release/obs-doctor.exe
          if-no-files-found: error

  # The tool only does real work on Windows, but the code is written so it
  # still compiles elsewhere. This keeps that promise for contributors.
  linux:
    name: Linux (solo compila)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
