name: Release

# Publishing a version: push a tag like v0.2.0.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Publicar el ejecutable de Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: La etiqueta debe coincidir con la versión de Cargo.toml
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "La etiqueta ${{ github.ref_name }} no coincide con la versión $version de Cargo.toml"
            exit 1
          }

      - name: Tests
        run: cargo test

      - name: Build de release
        run: cargo build --release

      - name: Preparar los archivos
        shell: pwsh
        run: |
          $name = "obs-doctor-${{ github.ref_name }}-windows-x64.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/obs-doctor.exe "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "dist/$name.sha256"
          Get-Content "dist/$name.sha256"

      - name: Crear el release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist).FullName --title "OBS Doctor ${{ github.ref_name }}" --generate-notes --verify-tag
